name: Validar pacote FEMO
on: [push, pull_request]
permissions:
  contents: read
jobs:
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar ferramentas de teste
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements-pdf.txt
      - name: Testar helpers com mídia sintética
        run: python -m unittest discover -s tests -v
      - name: Conferir botões e estrutura do PDF
        run: python scripts/audit_pdf.py docs/GUIA-FEMO-AI-STUDIO.pdf
